# Publica la página en Firebase Hosting cada vez que se aceptan cambios en main.
name: Publicar en Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DANIEL_TAPIA_ABOGADO }}
          channelId: live
          projectId: daniel-tapia-abogado
